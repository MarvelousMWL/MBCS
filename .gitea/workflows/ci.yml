name: CI
on:
  push:
    branches: [ mbcs-mwl-001 ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        shell: cmd
        run: |
          git clone http://mbcsadmin:605ec14b1dfc2fad736e2082dfb27c6fc684557b@localhost:3001/mbcsadmin/MBCS.git C:\ActionsRepo
      - name: Run tests
        shell: cmd
        working-directory: C:\ActionsRepo\bank-core
        run: mvn test
