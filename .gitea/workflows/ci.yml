name: CI
on:
  push:
    branches: [ mbcs-mwl-001 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clean and Checkout
        shell: cmd
        run: |
          if exist C:\mbcs_repo rmdir /s /q C:\mbcs_repo
          git clone http://mbcsadmin:fff92a248a1d50edcaeed7e8fb78f0e030bc847a@localhost:3001/mbcsadmin/MBCS.git C:\mbcs_repo
      - name: Test
        shell: cmd
        working-directory: C:\mbcs_repo\bank-core
        run: mvn test -s C:\mbcs_repo\bank-maven\settings.xml
      - name: Create PR and merge
        shell: powershell
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("mbcsadmin:fff92a248a1d50edcaeed7e8fb78f0e030bc847a"))
          $headers = @{"Content-Type"="application/json";"Authorization"="Basic $auth"}
          $body = @{title="Auto merge from CI";head="mbcs-mwl-001";base="master"} | ConvertTo-Json
          $pr = Invoke-RestMethod -Uri "http://localhost:3001/api/v1/repos/mbcsadmin/MBCS/pulls" -Method POST -Headers $headers -Body $body
          Write-Host "PR #$($pr.number) created"
          $merge = Invoke-RestMethod -Uri "http://localhost:3001/api/v1/repos/mbcsadmin/MBCS/pulls/$($pr.number)/merge" -Method POST -Headers $headers -Body (@{Do="merge"} | ConvertTo-Json)
          Write-Host "PR #$($pr.number) merged"
