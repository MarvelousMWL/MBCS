name: CI
on:
  push:
    branches: [ mbcs-mwl-001 ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Debug
        shell: cmd
        run: |
          echo Current dir: %cd%
          echo Workspace: %GITHUB_WORKSPACE%
          dir /s /b %cd%\..\bank-core 2>nul || echo No bank-core found
          dir /s /b %cd%\..\..\bank-core 2>nul || echo No ../.. bank-core found
