name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Compile
      run: mvn compile -f bank-core/pom.xml
    
    - name: Test
      run: mvn test -f bank-core/pom.xml
    
    - name: Package
      run: mvn package -Dmaven.test.skip=true -f bank-core/pom.xml
