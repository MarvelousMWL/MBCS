name: CI

on:
  push:
    branches: [ mbcs-mwl-001 ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: bank_core
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Init database
      run: |
        sleep 10
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/init.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/teller.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/teller_data.sql
    - name: Init product factory tables
      run: |
        mysql -h 127.0.0.1 -u root -p123456 bank_core < adbc_refactor_existing.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < adbc_new_tables.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/migration_product_factory.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < adbc_account_tables.sql
    - name: Init product data
      run: |
        mysql -h 127.0.0.1 -u root -p123456 bank_core < 产品初始化数据.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/alter_sub_account.sql

    - name: Compile
      run: mvn compile -f bank-core/pom.xml -s bank-maven/settings.xml

    - name: Test
      run: mvn test -f bank-core/pom.xml -s bank-maven/settings.xml

    - name: Package
      run: mvn package -Dmaven.test.skip=true -f bank-core/pom.xml -s bank-maven/settings.xml

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: bank_core
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Init database
      run: |
        sleep 10
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/init.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/teller.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/teller_data.sql
    - name: Init product factory tables
      run: |
        mysql -h 127.0.0.1 -u root -p123456 bank_core < adbc_refactor_existing.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < adbc_new_tables.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/migration_product_factory.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < adbc_account_tables.sql
    - name: Init product data
      run: |
        mysql -h 127.0.0.1 -u root -p123456 bank_core < 产品初始化数据.sql
        mysql -h 127.0.0.1 -u root -p123456 bank_core < bank-core/db/alter_sub_account.sql

    - name: Compile + Test
      run: mvn test -f bank-core/pom.xml -s bank-maven/settings.xml

    - name: Package
      run: mvn package -Dmaven.test.skip=true -f bank-core/pom.xml -s bank-maven/settings.xml

  auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master' && github.event.pull_request.head.ref == 'mbcs-mwl-001'
    needs: [pr-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Auto-merge PR
      run: |
        gh pr merge ${{ github.event.pull_request.number }} --merge --auto
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
