# ========== 开发时用 -- 带 rewrite 到 4173 和 3000 ==========
# 生产时用下面的配置，把所有 dist 放到一起

# --- 生产配置 ---
server {
    listen 80;
    server_name localhost;

    # 门户入口（默认首页）
    location / {
        root   E:/Agent/MyProject/MBCS/portal;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 柜面系统
    location /app/ {
        alias  E:/Agent/MyProject/MBCS/bank-web/dist/;
        index  index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
